[project]
name = "kia-connect-bridge"
# Unused: releases are versioned by their git tag. See "Versions" in the README.
version = "0.0.0"
description = "HTTP API wrapper around hyundai_kia_connect_api for Kia Connect / Hyundai Bluelink vehicles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "hyundai-kia-connect-api==5.1.2",
    "requests",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
