name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    # Every push to main is a release. Releases run one at a time, so two quick merges
    # can't claim the same version.
    concurrency:
      group: ${{ github.event_name == 'push' && 'release' || github.run_id }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: steps.version.outputs.version
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: mattlunn/kia-connect-bridge
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.version != '' }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.version.outputs.version != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Publish the GitHub release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sdk=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "hyundai-kia-connect-api"))')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes \
            --notes "Ships with hyundai-kia-connect-api $sdk. Docker: \`mattlunn/kia-connect-bridge:$VERSION\`"
      - uses: peter-evans/dockerhub-description@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: mattlunn/kia-connect-bridge
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
